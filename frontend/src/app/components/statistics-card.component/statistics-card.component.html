<div class="statistics-section">
  <!-- Header -->
  <div class="stats-header" *ngIf="title || subtitle">
    <div class="stats-title" *ngIf="title">
      <h2>{{ title }}</h2>
    </div>
    <p class="stats-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <!-- Statistics Grid -->
  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card">
      <div class="stat-icon" [class]="stat.color">
        <i [class]="stat.icon"></i>
      </div>
      <div class="stat-info">
        <h3>{{ stat.value }}</h3>
        <p>{{ stat.description }}</p>
      </div>
    </div>
  </div>
</div>
