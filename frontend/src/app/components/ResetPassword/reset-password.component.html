<div class="background">
  <div class="modal-container">
    <div class="modal">
      <!-- Left Section -->
      <div class="left-section">
        <h2 class="promo-title">Reset your password</h2>
        <p class="promo-text">
          Enter your username and choose a new password to regain access to your account.
        </p>
      </div>

      <!-- Right Section -->
      <div class="right-section">
        <div class="logo-container">
          <span class="logo-text">RH</span>
        </div>
        <h3 class="form-title">Reset Password</h3>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          <!-- Username -->
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input
              id="username"
              type="text"
              formControlName="username"
              class="form-input"
              placeholder="Enter your username"
              [class.error]="resetForm.get('username')?.touched && resetForm.get('username')?.invalid"
            />
            <div class="error-message" *ngIf="resetForm.get('username')?.touched && resetForm.get('username')?.invalid">
              {{ getErrorMessage('username') }}
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group password-wrapper">
            <label class="form-label" for="password">New Password</label>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="form-input"
              placeholder="Enter new password"
              [class.error]="resetForm.get('password')?.touched && resetForm.get('password')?.invalid"
            />
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
              <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
            <div class="error-message" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
              {{ getErrorMessage('password') }}
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="signin-button" [disabled]="isLoading">
            {{ isLoading ? 'Resetting...' : 'Reset Password' }}
          </button>

          <!-- Messages -->
          <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
          <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

          <p class="signup-text">
            Remember your password? <a routerLink="/login" class="signup-link">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
