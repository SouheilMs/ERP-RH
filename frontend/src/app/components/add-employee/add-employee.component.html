<div *ngIf="isOpen" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add Employee</h2>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <form #employeeForm="ngForm" (ngSubmit)="saveEmployee()">
        <!-- Personal Information -->
        <div class="form-section">
          <h4>Personal Information</h4>



          <div class="form-row">
            <div class="form-group">
              <label for="username">Full Name *</label>
              <input type="text" id="username" name="username" [(ngModel)]="employee.username" required class="form-control" placeholder="Enter full name">
            </div>

            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" [(ngModel)]="employee.email" required class="form-control" placeholder="Enter email">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" name="phone" [(ngModel)]="employee.phone" class="form-control" placeholder="Enter phone number">
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" [(ngModel)]="employee.gender" class="form-control">
                <option value="">-- Select Gender --</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password *</label>
              <input type="password" id="password" name="password" [(ngModel)]="employee.password" required class="form-control" placeholder="Enter password">
            </div>
          </div>
        </div>

        <!-- Employment Information -->
        <div class="form-section">
          <h4>Employment Information</h4>

          <div class="form-row">
            <div class="form-group">
              <label for="hireDate">Hire Date</label>
              <input type="date" id="hireDate" name="hireDate" [(ngModel)]="employee.hireDate" class="form-control">
            </div>

            <div class="form-group">
              <label for="salary">Salary (TND)</label>
              <input type="number" id="salary" name="salary" [(ngModel)]="employee.salary" class="form-control" placeholder="Enter salary" step="0.01" min="0">
            </div>
          </div>
          <!-- Rôle -->
          <div class="form-group">
            <label class="required">Rôle</label>
            <select [(ngModel)]="employee.role" name="role" required>
              <option *ngFor="let role of availableRoles" [value]="role.value">
                {{ role.label }}
              </option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="position">Position *</label>
              <select id="position" name="position" [(ngModel)]="employee.position" required class="form-control">
                <option value="">-- Select Position --</option>
                <option value="SOFTWARE_DEVELOPER">Software Developer</option>
                <option value="SENIOR_DEVELOPER">Senior Developer</option>
                <option value="FRONTEND_DEVELOPER">Frontend Developer</option>
                <option value="BACKEND_DEVELOPER">Backend Developer</option>
                <option value="FULLSTACK_DEVELOPER">Fullstack Developer</option>
                <option value="SOFTWARE_ENGINEER">Software Engineer</option>
                <option value="SYSTEM_ENGINEER">System Engineer</option>
                <option value="DEVOPS_ENGINEER">DevOps Engineer</option>
                <option value="QA_ENGINEER">QA Engineer</option>
                <option value="DATA_ENGINEER">Data Engineer</option>
                <option value="PROJECT_MANAGER">Project Manager</option>
                <option value="TEAM_LEAD">Team Lead</option>
                <option value="TECH_LEAD">Tech Lead</option>
                <option value="PRODUCT_MANAGER">Product Manager</option>
                <option value="HR_MANAGER">HR Manager</option>
                <option value="FINANCE_MANAGER">Finance Manager</option>
                <option value="SALES_MANAGER">Sales Manager</option>
                <option value="MARKETING_SPECIALIST">Marketing Specialist</option>
                <option value="UI_UX_DESIGNER">UI/UX Designer</option>
                <option value="GRAPHIC_DESIGNER">Graphic Designer</option>
                <option value="DATA_ANALYST">Data Analyst</option>
                <option value="BUSINESS_ANALYST">Business Analyst</option>
                <option value="IT_SUPPORT">IT Support</option>
                <option value="NETWORK_ADMIN">Network Administrator</option>
                <option value="DATABASE_ADMIN">Database Administrator</option>
                <option value="SECURITY_ANALYST">Security Analyst</option>
                <option value="INTERN">Intern</option>
                <option value="JUNIOR_DEVELOPER">Junior Developer</option>
                <option value="MID_LEVEL_DEVELOPER">Mid-Level Developer</option>
                <option value="SENIOR_ENGINEER">Senior Engineer</option>
                <option value="ARCHITECT">Software Architect</option>
                <option value="OTHER">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="status">Employment Status</label>
              <select id="status" name="status" [(ngModel)]="employee.status" class="form-control">
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
                <option value="ON_LEAVE">On Leave</option>
                <option value="PROBATION">Probation</option>
                <option value="TERMINATED">Terminated</option>
                <option value="RESIGNED">Resigned</option>
              </select>
            </div>
          </div>

          <!-- Custom Position Field (shown only when "Other" is selected) -->
          <div class="form-row" *ngIf="employee.position === 'OTHER'">
            <div class="form-group">
              <label for="customPosition">Custom Position *</label>
              <input type="text" id="customPosition" name="customPosition" [(ngModel)]="employee.customPosition" class="form-control" placeholder="Enter custom position" required>
            </div>
          </div>
        </div>

        <!-- Tunisian Payroll Information -->
        <div class="form-section">
          <h4>Payroll Information</h4>

          <div class="form-row">
            <div class="form-group">
              <label for="cin">CIN *</label>
              <input type="text" id="cin" name="cin" [(ngModel)]="employee.cin" required class="form-control" placeholder="Carte d'identité nationale">
            </div>

            <div class="form-group">
              <label for="cnssNumber">CNSS Number *</label>
              <input type="text" id="cnssNumber" name="cnssNumber" [(ngModel)]="employee.cnssNumber" required class="form-control" placeholder="Numéro de sécurité sociale">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="matricule">Matricule *</label>
              <input type="text" id="matricule" name="matricule" [(ngModel)]="employee.matricule" required class="form-control" placeholder="Matricule interne">
            </div>

            <div class="form-group">
              <label for="workingDays">Working Days (per month)</label>
              <input type="number" id="workingDays" name="workingDays" [(ngModel)]="employee.workingDays" class="form-control" min="0" max="31">
            </div>
          </div>
        </div>

        <!-- Address & Bank Information -->
        <div class="form-section">
          <h4>Address & Bank Information</h4>

          <div class="form-row">
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" [(ngModel)]="employee.address" class="form-control" placeholder="Enter address">
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" [(ngModel)]="employee.city" class="form-control" placeholder="Enter city">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="rib">RIB</label>
              <input type="text" id="rib" name="rib" [(ngModel)]="employee.rib" class="form-control" placeholder="Numéro RIB bancaire">
            </div>

            <div class="form-group">
              <label for="bankName">Bank Name</label>
              <input type="text" id="bankName" name="bankName" [(ngModel)]="employee.bankName" class="form-control" placeholder="Nom de la banque">
            </div>
          </div>
        </div>

        <!-- Allowances & Bonuses -->
        <div class="form-section">
          <h4>Allowances & Bonuses (TND)</h4>

          <div class="form-row">
            <div class="form-group">
              <label for="transportAllowance">Transport Allowance</label>
              <input type="number" id="transportAllowance" name="transportAllowance" [(ngModel)]="employee.transportAllowance" class="form-control" placeholder="Indemnité de transport" step="0.01" min="0">
            </div>

            <div class="form-group">
              <label for="familyAllowance">Family Allowance</label>
              <input type="number" id="familyAllowance" name="familyAllowance" [(ngModel)]="employee.familyAllowance" class="form-control" placeholder="Allocation familiale" step="0.01" min="0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="otherBonuses">Other Bonuses</label>
              <input type="number" id="otherBonuses" name="otherBonuses" [(ngModel)]="employee.otherBonuses" class="form-control" placeholder="Autres primes" step="0.01" min="0">
            </div>

            <div class="form-group">
              <label for="actualWorkingDays">Actual Working Days</label>
              <input type="number" id="actualWorkingDays" name="actualWorkingDays" [(ngModel)]="employee.actualWorkingDays" class="form-control" min="0" max="31">
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!employeeForm.valid || isSubmitting">
            {{ isSubmitting ? 'Adding...' : 'Add Employee' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
