<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="logo-icon">🏢</i>
        <span class="logo-text">HR ERP</span>
      </div>
      <h1 class="auth-title">Login</h1>
      <p class="auth-subtitle">Access your personal space</p>
    </div>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-input"
          placeholder="your@email.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div class="error-message" [class.show]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email address
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          placeholder="Your password"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="error-message" [class.show]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required
        </div>
      </div>

      <button
        type="submit"
        class="auth-button"
        [disabled]="loginForm.invalid || isLoading">
        @if (!isLoading) {
          <span>Sign In</span>
        }
        @if (isLoading) {
          <span class="loading">Signing in...</span>
        }
      </button>

      <div class="auth-footer">
        <p>Forgot password? 
          <a routerLink="/reset-password" class="auth-link">Reset password</a>
        </p>
      </div>
    </form>
  </div>
</div>
