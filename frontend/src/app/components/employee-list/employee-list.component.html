<div class="employee-list-container">
  <!-- Header with action buttons -->
  <div class="header-actions">
    <h2>Employee Management</h2>

    <div class="action-buttons">
      <!-- Add Button -->
      <button class="btn btn-primary" (click)="openAddModal()">
        + Add Employee
      </button>

      <!-- Excel Import -->
      <div class="file-upload-wrapper">
        <label for="excel-import" class="btn btn-secondary">
          📊 Import Excel
        </label>
        <input
          id="excel-import"
          type="file"
          accept=".xlsx, .xls"
          (change)="importExcel($event)"
          style="display: none;">
      </div>

      <!-- Excel Export -->
      <button class="btn btn-success" (click)="exportExcel()">
        ⬇️ Export Excel
      </button>
    </div>
  </div>

  <!-- Status messages -->
  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Search bar -->
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterEmployees()"
      placeholder="Search for an employee..."
      class="search-input">
  </div>

  <!-- Employees table -->
  <div class="table-container">
    <table class="employees-table">
      <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>position</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <!-- Loading state -->
      <tr *ngIf="loading">
        <td colspan="5" class="loading-cell">
          <div class="loading-spinner">Loading...</div>
        </td>
      </tr>

      <!-- No results -->
      <tr *ngIf="!loading && filteredEmployees.length === 0">
        <td colspan="5" class="no-data">
          No employees found
        </td>
      </tr>

      <!-- Employees list -->
      <tr *ngFor="let employee of filteredEmployees; trackBy: trackByEmployeeId">
        <td>
          <strong>{{ employee.username }}</strong>
        </td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phone || 'Not provided' }}</td>
        <td>
            <span [class]="'status-badge ' + (employee.status?.toLowerCase() || 'inactive')">
              {{ employee.status || 'Inactive' }}
            </span>
        </td>
        <td class="actions-cell">
  <!-- View details button -->
  <a
    [routerLink]="['/employees', employee.id]"
    class="btn btn-info btn-xs">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
    </svg>
  </a>

  <!-- Delete button -->
  <button
    (click)="deleteEmployee(employee.id)"
    class="btn btn-danger btn-xs"
    [disabled]="loading">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
      <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
    </svg> 
  </button>
</td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Add employee modal -->
  <app-add-employee
    *ngIf="showAddModal"
    (closeModalEvent)="closeAddModal()"
    (employeeAdded)="onEmployeeAdded()">
  </app-add-employee>
</div>
