<div class="employee-list-container">
  <!-- En-tête avec boutons d'action -->
  <div class="header-actions">
    <h2>Gestion des Employés</h2>

    <div class="action-buttons">
      <!-- Bouton Ajouter -->
      <button class="btn btn-primary" (click)="openAddModal()">
        + Ajouter un employé
      </button>

      <!-- Import Excel -->
      <div class="file-upload-wrapper">
        <label for="excel-import" class="btn btn-secondary">
          📊 Importer Excel
        </label>
        <input
          id="excel-import"
          type="file"
          accept=".xlsx, .xls"
          (change)="importExcel($event)"
          style="display: none;">
      </div>

      <!-- Export Excel -->
      <button class="btn btn-success" (click)="exportExcel()">
        ⬇️ Exporter Excel
      </button>
    </div>
  </div>

  <!-- Messages de statut -->
  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Barre de recherche -->
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterEmployees()"
      placeholder="Rechercher un employé..."
      class="search-input">
  </div>

  <!-- Tableau des employés -->
  <div class="table-container">
    <table class="employees-table">
      <thead>
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <!-- État de chargement -->
      <tr *ngIf="loading">
        <td colspan="5" class="loading-cell">
          <div class="loading-spinner">Chargement...</div>
        </td>
      </tr>

      <!-- Aucun résultat -->
      <tr *ngIf="!loading && filteredEmployees.length === 0">
        <td colspan="5" class="no-data">
          Aucun employé trouvé
        </td>
      </tr>

      <!-- Liste des employés -->
      <tr *ngFor="let employee of filteredEmployees; trackBy: trackByEmployeeId">
        <td>
          <strong>{{ employee.username }}</strong>
        </td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phone || 'Non renseigné' }}</td>
        <td>
            <span [class]="'status-badge ' + (employee.status?.toLowerCase() || 'inactive')">
              {{ employee.status || 'Inactive' }}
            </span>
        </td>
        <td class="actions-cell">
          <!-- Bouton Voir détails -->
          <a
            [routerLink]="['/employees', employee.id]"
            class="btn btn-info btn-sm">
            👁️ Voir
          </a>

          <!-- Bouton Supprimer -->
          <button
            (click)="deleteEmployee(employee.id)"
            class="btn btn-danger btn-sm"
            [disabled]="loading">
            🗑️ Supprimer
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal d'ajout d'employé -->
  <app-add-employee
    *ngIf="showAddModal"
    (closeModalEvent)="closeAddModal()"
    (employeeAdded)="onEmployeeAdded()">
  </app-add-employee>
</div>
