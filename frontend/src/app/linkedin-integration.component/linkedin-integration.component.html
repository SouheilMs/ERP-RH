<!-- src/app/linkedin-integration.component.html -->
<div class="linkedin-integration-container">
  <!-- Tab Navigation -->
  <div class="tab-navigation">
    <button class="tab-button" [class.active]="activeTab === 0" (click)="onTabChange(0)">
      <i class="pi pi-chart-line"></i>
      <span>Statut</span>
    </button>
    <button class="tab-button" [class.active]="activeTab === 1" (click)="onTabChange(1)">
      <i class="pi pi-list"></i>
      <span>Publications</span>
    </button>
    <button class="tab-button" [class.active]="activeTab === 2" (click)="onTabChange(2)">
      <i class="pi pi-link"></i>
      <span>Configuration</span>
    </button>
  </div>

  <!-- Content -->
  @if (activeTab === 0) {
    <app-linkedin-status></app-linkedin-status>
  }
  @if (activeTab === 1) {
    <app-linkedin-posts></app-linkedin-posts>
  }
  @if (activeTab === 2) {
    <app-linkedin-auth></app-linkedin-auth>
  }
</div>
