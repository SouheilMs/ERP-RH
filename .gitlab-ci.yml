stages:
  - build
  - test

# ---------- BACKEND ----------
build-backend:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - mvn clean compile -DskipTests

test-backend:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    SPRING_PROFILES_ACTIVE: test
  script:
    - cd backend
    - mvn test

# ---------- FRONTEND ----------
build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration=production

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm test -- --watch=false --browsers=ChromeHeadless
