stages:
  - build
  - test
  - quality
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

  IMAGE_NAME_BACKEND: $DOCKERHUB_USERNAME/backend
  IMAGE_NAME_FRONTEND: $DOCKERHUB_USERNAME/frontend

cache:
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# ================= BACKEND =================

build-backend:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/

test-backend:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn test
  allow_failure: true

# ================= FRONTEND =================

build-frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build --configuration=production
  artifacts:
    paths:
      - frontend/dist/
  allow_failure: true

# ================= SONAR (OPTIONNEL) =================

sonar-backend:
  stage: quality
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd backend
    - |
      if [ -z "$SONAR_HOST_URL" ]; then
        echo "SonarQube non configuré – étape ignorée"
      else
        mvn sonar:sonar \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN
      fi
  only:
    - main
  allow_failure: true

# ================= DOCKER BUILD & PUSH =================

docker-build-push:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    - docker build -t $IMAGE_NAME_BACKEND:latest ./backend
    - docker build -t $IMAGE_NAME_FRONTEND:latest ./frontend

    - docker push $IMAGE_NAME_BACKEND:latest
    - docker push $IMAGE_NAME_FRONTEND:latest
  only:
    - main
