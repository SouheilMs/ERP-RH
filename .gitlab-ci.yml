stages:
  - build
  - test
  - quality
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME_BACKEND: $DOCKERHUB_USERNAME/backend
  IMAGE_NAME_FRONTEND: $DOCKERHUB_USERNAME/frontend

# Cache pour accélérer les builds
cache:
  paths:
    - backend/.m2/repository
    - frontend/node_modules/
    - .sonar/cache

# Jobs Backend
build-backend:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/

test-backend:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    SPRING_PROFILES_ACTIVE: test
  script:
    - cd backend
    - mvn test
  artifacts:
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml

integration-test-backend:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    SPRING_PROFILES_ACTIVE: test
  script:
    - cd backend
    - mvn verify -Dit.test="*IT" -DfailIfNoTests=false

# Jobs Frontend
build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration=production
  artifacts:
    paths:
      - frontend/dist/

test-frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - apk add --no-cache chromium
    - export CHROME_BIN=/usr/bin/chromium
    - npm ci
  script:
    # Run tests with coverage
    - npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
  artifacts:
    when: always
    reports:
      junit:
        - frontend/coverage/junit.xml
    paths:
      - frontend/coverage/
      - frontend/coverage/lcov.info
  cache:
    key: "${CI_COMMIT_REF_SLUG}-frontend"
    paths:
      - frontend/node_modules/

# E2E tests with Cypress
e2e-frontend:
  stage: test
  image: cypress/included:latest
  variables:
    # Cypress specific variables
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"
    # Disable GPU for CI environments
    ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cypress"
    paths:
      - cache/Cypress
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    # Start Angular dev server in background
    - npm start &
    # Wait for server to be ready
    - npx wait-on http://localhost:4200 --timeout 60000
    # Run Cypress tests
    - npx cypress run
  after_script:
    # Kill the Angular server
    - pkill -f "ng serve" || true
  artifacts:
    when: always
    paths:
      - frontend/cypress/videos/
      - frontend/cypress/screenshots/
    reports:
      junit:
        - frontend/cypress/results/*.xml
    expire_in: 1 week
  allow_failure: true

# Analyse de qualité avec SonarQube
sonar-backend:
  stage: quality
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - |
      if [ -z "$SONAR_HOST_URL" ] || [ "$SONAR_HOST_URL" = "host_url" ]; then
        echo "INFO: SONAR_HOST_URL not configured. Skipping SonarQube analysis for backend."
        echo "To enable SonarQube analysis, set SONAR_HOST_URL and SONAR_TOKEN in GitLab CI variables."
      else
        echo "Running SonarQube analysis for backend..."
        mvn sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN || echo "SonarQube analysis completed with warnings (this is normal)"
      fi
  dependencies:
    - test-backend
  only:
    - main
    - merge_requests

sonar-frontend:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - cd frontend
    - |
      if [ -z "$SONAR_HOST_URL" ] || [ "$SONAR_HOST_URL" = "host_url" ]; then
        echo "INFO: SONAR_HOST_URL not configured. Skipping SonarQube analysis for frontend."
        echo "To enable SonarQube analysis, set SONAR_HOST_URL and SONAR_TOKEN in GitLab CI variables."
      else
        echo "Running SonarQube analysis for frontend..."
        sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN || echo "SonarQube analysis completed with warnings (this is normal)"
      fi
  dependencies:
    - test-frontend
  only:
    - main
    - merge_requests

# Analyse de sécurité
security-scan:
  stage: security
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker run --rm
      -v "$PWD/backend:/src"
      aquasec/trivy:latest
      fs --severity HIGH,CRITICAL /src

# Build et push des images Docker
docker-build-push:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  variables:
    IMAGE_NAME_BACKEND: "$DOCKERHUB_USERNAME/backend"
    IMAGE_NAME_FRONTEND: "$DOCKERHUB_USERNAME/frontend"
  before_script:
    # Login to Docker Hub
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    # Build and push Backend
    - docker build -t $IMAGE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_NAME_BACKEND:latest ./backend
    - docker push $IMAGE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME_BACKEND:latest

    # Build and push Frontend
    - docker build -t $IMAGE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_NAME_FRONTEND:latest ./frontend
    - docker push $IMAGE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME_FRONTEND:latest
  only:
    - main
  dependencies: []

# Déploiement (exemple sur un serveur)
deploy-staging:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - echo "$SSH_PRIVATE_KEY" > ssh_key
    - chmod 600 ssh_key
    - ssh -o StrictHostKeyChecking=no -i ssh_key user@staging-server "
      docker pull $IMAGE_NAME_BACKEND:latest &&
      docker pull $IMAGE_NAME_FRONTEND:latest &&
      docker-compose -f /opt/app/docker-compose.prod.yml up -d"
  environment:
    name: staging
    url: https://staging.votre-app.com
  only:
    - main
    - sirine