stages:
  - build
  - test
  - quality
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME_BACKEND: $DOCKERHUB_USERNAME/backend
  IMAGE_NAME_FRONTEND: $DOCKERHUB_USERNAME/frontend

# Cache pour accélérer les builds
cache:
  paths:
    - backend/.m2/repository
    - frontend/node_modules/
    - .sonar/cache

# Jobs Backend
build-backend:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/

test-backend:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    SPRING_PROFILES_ACTIVE: test
  script:
    - cd backend
    - mvn test
  artifacts:
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml

integration-test-backend:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    SPRING_PROFILES_ACTIVE: test
  script:
    - cd backend
    - mvn verify -Dit.test="*IT" -DfailIfNoTests=false

# Jobs Frontend
build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration=production
  artifacts:
    paths:
      - frontend/dist/

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm test -- --watch=false --browsers=ChromeHeadless
    - npm run e2e -- --configuration=ci

# Analyse de code qualité (SonarQube - BONUS)
sonarqube-check:
  stage: quality
  image: maven:3.8-openjdk-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - cd backend
    - mvn clean verify sonar:sonar
      -Dsonar.projectKey=mon-projet-spring
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.login=${SONAR_TOKEN}
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  allow_failure: true
  only:
    - main
    - merge_requests

# Analyse de sécurité
security-scan:
  stage: security
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker run --rm
      -v "$PWD/backend:/src"
      aquasec/trivy:latest
      fs --severity HIGH,CRITICAL /src

# Build et push des images Docker
docker-build-push:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  variables:
    DOCKER_REGISTRY: docker.io # Ou votre registry GitLab
    IMAGE_NAME_BACKEND: $CI_REGISTRY_IMAGE/backend
    IMAGE_NAME_FRONTEND: $CI_REGISTRY_IMAGE/frontend
  script:
    # Login Docker Hub
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    
    # Build et tag Backend
    - docker build -t $IMAGE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA ./backend
    - docker tag $IMAGE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA $IMAGE_NAME_BACKEND:latest
    
    # Build et tag Frontend
    - docker build -t $IMAGE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA ./frontend
    - docker tag $IMAGE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA $IMAGE_NAME_FRONTEND:latest
    
    # Push vers Docker Hub
    - docker push $IMAGE_NAME_BACKEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME_BACKEND:latest
    - docker push $IMAGE_NAME_FRONTEND:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME_FRONTEND:latest
  only:
    - main

# Déploiement (exemple sur un serveur)
deploy-staging:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - echo "$SSH_PRIVATE_KEY" > ssh_key
    - chmod 600 ssh_key
    - ssh -o StrictHostKeyChecking=no -i ssh_key user@staging-server "
      docker pull $IMAGE_NAME_BACKEND:latest &&
      docker pull $IMAGE_NAME_FRONTEND:latest &&
      docker-compose -f /opt/app/docker-compose.prod.yml up -d"
  environment:
    name: staging
    url: https://staging.votre-app.com
  only:
    - main