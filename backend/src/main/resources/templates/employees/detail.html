<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout/dashboard :: layout(~{::title}, ~{::content}, ~{::script})">
<head>
    <title th:text="${employee.username + ' - Profile'}">Employee Profile</title>
</head>
<body>

<div th:fragment="content">
    <div class="employee-container">
        <!-- Employee Profile -->
        <div class="employee-profile">
            <div class="profile-header">
                <!-- Photo on left -->
                <div class="photo-section">
                    <div class="photo-wrapper">
                        <img class="profile-photo" th:src="${employee.photoUrl} ?: '/images/default-profile.png'"
                             alt="Employee Photo">
                    </div>
                </div>

                <!-- Information on right -->
                <div class="profile-info">
                    <h2 th:text="${employee.username}">Employee Name</h2>
                    <p><strong>Email:</strong> <span th:text="${employee.email}">-</span></p>
                    <p><strong>Phone:</strong> <span th:text="${employee.phone ?: '-'}">-</span></p>
                    <p><strong>Position:</strong> <span th:text="${employee.position ?: '-'}">-</span></p>
                    <p><strong>Hire Date:</strong>
                        <span th:text="${#dates.format(employee.hireDate, 'yyyy-MM-dd') ?: '-'}">-</span>
                    </p>
                </div>

                <div class="payslip-action">
                    <a th:href="@{/employees/{id}/payslips(id=${employee.id})}" class="payslip-btn">
                        <i class="fas fa-file-invoice-dollar"></i>
                        View Payslip History
                    </a>
                </div>
            </div>

            <!-- Salary information -->
            <div class="salary-row">
                <strong>Salary:</strong>
                <span th:text="${#numbers.formatCurrency(employee.salary ?: 0)}">0.0</span> TND
            </div>
        </div>

        <!-- Modification form (visible selon permissions) -->
        <div th:if="${hasPermission or isOwnProfile}" class="employee-form">
            <h3>Update Information</h3>
            <form th:action="@{/th/employees/{id}(id=${employee.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Common fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input id="username" type="text" name="username" th:value="${employee.username}"
                               maxlength="50" th:readonly="${!hasRole('ROLE_HR')}">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input id="email" type="email" name="email" th:value="${employee.email}"
                               maxlength="50">
                    </div>
                </div>

                <!-- HR fields (only for HR viewing other employees) -->
                <div th:if="${hasRole('ROLE_HR') and not isOwnProfile}" class="form-row">
                    <div class="form-group">
                        <label for="salary">Salary (TND):</label>
                        <input id="salary" type="number" name="salary" th:value="${employee.salary}"
                               step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="position">Position:</label>
                        <input id="position" type="text" name="position" th:value="${employee.position}"
                               maxlength="50">
                    </div>
                </div>

                <button type="submit" class="update-btn">Update Information</button>
            </form>

            <!-- Photo upload section (only for HR on other employees) -->
            <div th:if="${hasRole('ROLE_HR') and not isOwnProfile}" class="photo-upload-section">
                <h4>Change Profile Photo</h4>
                <form th:action="@{/th/employees/{id}/upload-photo(id=${employee.id})}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="photo-upload-form">
                        <input type="file" name="file" accept="image/*">
                        <button type="submit" class="upload-photo-btn">
                            Upload Photo
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Formations Container -->
        <div class="formation-container">
            <h3 class="formation-title">
                <i class="fas fa-graduation-cap"></i>
                Formations
                <button class="icon-btn" data-bs-toggle="modal" data-bs-target="#addFormationModal"
                        title="Add formation">&#10010;</button>
            </h3>

            <!-- Message if no formations -->
            <div th:if="${#lists.isEmpty(employee.formations)}" class="no-formations">
                No formations added yet.
            </div>

            <!-- Formations List -->
            <ul class="formation-list" th:unless="${#lists.isEmpty(employee.formations)}">
                <li th:each="formation : ${employee.formations}" class="formation-item">
                    <div class="formation-row">
                        <div class="formation-left">
                            <span class="formation-label">Formation Name:</span>
                            <span th:text="${formation.name}">-</span>
                        </div>
                        <div class="formation-right">
                            <span class="formation-label">Start Date:</span>
                            <span th:text="${#dates.format(formation.startDate, 'yyyy-MM-dd')}">-</span>
                        </div>
                    </div>

                    <div class="formation-row">
                        <div class="formation-left">
                            <span class="formation-label">Location:</span>
                            <span th:text="${formation.location ?: '-'}">-</span>
                        </div>
                        <div class="formation-right">
                            <span class="formation-label">End Date:</span>
                            <span th:text="${#dates.format(formation.endDate, 'yyyy-MM-dd')}">-</span>
                        </div>
                    </div>

                    <div class="formation-row formation-actions">
                        <div class="formation-left" th:if="${formation.certificateId}">
                            <span class="formation-label">Formation PDF:</span>
                            <a th:href="@{/th/employees/formations/certificate/{id}(id=${formation.certificateId})}"
                               target="_blank" class="pdf-btn">
                                View PDF
                            </a>
                        </div>
                        <div class="formation-right">
                            <form th:action="@{/th/employees/{empId}/formations/{id}/delete(empId=${employee.id}, id=${formation.id})}"
                                  method="post" style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="delete-btn"
                                        onclick="return confirm('Are you sure you want to delete this formation?')">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <!-- Add Formation Modal -->
    <div class="modal fade" id="addFormationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Formation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/th/employees/{id}/formations(id=${employee.id})}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="form-group mb-3">
                            <label>Formation Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="form-group mb-3">
                            <label>Location *</label>
                            <input type="text" name="location" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Start Date *</label>
                                <input type="date" name="startDate" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label>End Date *</label>
                                <input type="date" name="endDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <label>Certificate (PDF)</label>
                            <input type="file" name="certificate" class="form-control" accept=".pdf">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Formation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
