<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar-header">
        <h3>Navigation</h3>
    </div>

    <ul class="sidebar-menu">
        <!-- Dashboard -->
        <li>
            <a th:href="@{/dashboard}" th:classappend="${#request.getRequestURI().contains('dashboard')} ? 'active'">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <!-- Employees - Visible seulement pour HR et HR Manager -->
        <li th:if="${#authorization.expression('hasRole(''HR'') or hasRole(''HRMANAGER'')')}">
            <a th:href="@{/employees}" th:classappend="${#request.getRequestURI().contains('employees')} ? 'active'">
                <i class="fas fa-users"></i>
                <span>Employees</span>
            </a>
        </li>

        <!-- My Profile - Visible pour tous -->
        <li>
            <a th:href="@{/my-profile}" th:classappend="${#request.getRequestURI().contains('my-profile')} ? 'active'">
                <i class="fas fa-user"></i>
                <span>My Profile</span>
            </a>
        </li>

        <!-- Logout -->
        <li>
            <a th:href="@{/auth/logout}">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </li>
    </ul>
</aside>
</body>
</html>
