<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<nav class="navbar" th:fragment="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <i class="fas fa-building"></i>
            <span>HR VISION</span>
        </div>

        <div class="navbar-menu">
            <div th:if="${#authentication.authenticated}">
                    <span class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span th:text="${#authentication.name}"></span>
                    </span>
                <a th:href="@{/auth/logout}" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
            <div th:unless="${#authentication.authenticated}">
                <a th:href="@{/auth/login}" class="btn btn-secondary">Login</a>
                <a th:href="@{/auth/signup}" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
