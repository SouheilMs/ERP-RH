<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - HR System'">HR System</title>

    <!-- Bootstrap CSS (optionnel) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Vos styles CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Thymeleaf fragments pour les sections de contenu -->
    <th:block th:fragment="head"></th:block>
</head>
<body>
<!-- Header/Navigation -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">HR VISION</a>
        <div class="collapse navbar-collapse">
            <div class="navbar-nav ms-auto">
                <!-- Afficher selon le statut d'authentification -->
                <div th:if="${session.user != null}">
                        <span class="navbar-text me-3">
                            Bienvenue, <span th:text="${session.user.username}">User</span>
                        </span>
                    <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </a>
                </div>
                <div th:unless="${session.user != null}">
                    <a class="btn btn-outline-light btn-sm me-2" th:href="@{/auth/login}">
                        Connexion
                    </a>
                    <a class="btn btn-primary btn-sm" th:href="@{/auth/signup}">
                        Inscription
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Contenu principal -->
<main>
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>

<!-- Scripts supplémentaires par page -->
<th:block th:fragment="scripts"></th:block>
</body>
</html>
