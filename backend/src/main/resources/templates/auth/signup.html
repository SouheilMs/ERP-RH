<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Teamlyf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .auth-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .logo-icon {
            font-size: 2rem;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .auth-title {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            color: #7f8c8d;
            margin-bottom: 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #2c3e50;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .form-input.error {
            border-color: #e74c3c;
        }
        .error-message {
            color: #e74c3c;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .auth-button {
            width: 100%;
            padding: 0.75rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .auth-button:hover {
            background-color: #2980b9;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #7f8c8d;
        }
        .auth-link {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-link:hover {
            text-decoration: underline;
        }
        .global-error {
            text-align: center;
            padding: 0.75rem;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .radio-group {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
        .radio-input {
            accent-color: #3498db;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <i class="logo-icon">👥</i>
                <span class="logo-text">Teamlyf</span>
            </div>
            <h1 class="auth-title">Sign Up</h1>
            <p class="auth-subtitle">Create your Teamlyf account</p>
        </div>

        <div th:if="${errorMessage}" class="error-message global-error">
            [[${errorMessage}]]
        </div>

        <form class="auth-form" th:action="@{/auth/signup}" method="post" th:object="${signupRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" th:field="*{username}" class="form-input"
                       placeholder="Your username"
                       th:classappend="${#fields.hasErrors('username')} ? 'error' : ''">
                <div th:if="${#fields.hasErrors('username')}" class="error-message">
                    <span th:errors="*{username}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-input"
                       placeholder="your@email.com"
                       th:classappend="${#fields.hasErrors('email')} ? 'error' : ''">
                <div th:if="${#fields.hasErrors('email')}" class="error-message">
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-input"
                       placeholder="Your password"
                       th:classappend="${#fields.hasErrors('password')} ? 'error' : ''">
                <div th:if="${#fields.hasErrors('password')}" class="error-message">
                    <span th:errors="*{password}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-input"
                       placeholder="Confirm your password"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'error' : ''">
                <div th:if="${#fields.hasErrors('confirmPassword')}" class="error-message">
                    <span th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Role</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="role" value="ROLE_EMPLOYEE" checked class="radio-input">
                        Employee
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="role" value="ROLE_HR" class="radio-input">
                        HR
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="role" value="ROLE_HRMANAGER" class="radio-input">
                        HR Manager
                    </label>
                </div>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

            <div class="auth-footer">
                <p>Already have an account?
                    <a th:href="@{/auth/login}" class="auth-link">Sign in</a>
                </p>
            </div>
        </form>
    </div>
</div>
</body>
</html>
